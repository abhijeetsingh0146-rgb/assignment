<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple responsive navigation bar built with CSS flexbox.">
  <title>Week 7 · Flexbox Navbar</title>
  <style>
    :root {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      color: #172033;
      background-color: #f8fafc;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
    }

    .site-header {
      padding: 16px 24px;
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgb(15 23 42 / 6%);
    }

    .navbar {
      display: flex;
      width: min(100%, 1100px);
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin: 0 auto;
    }

    .navbar__logo {
      flex-shrink: 0;
      color: #1d4ed8;
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
    }

    .navbar__actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 28px;
    }

    .navbar__links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 24px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .navbar__link {
      color: #334155;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
    }

    .navbar__link:hover,
    .navbar__link:focus-visible {
      color: #1d4ed8;
    }

    .navbar__button {
      flex-shrink: 0;
      padding: 10px 18px;
      border-radius: 8px;
      background-color: #1d4ed8;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    .navbar__button:hover,
    .navbar__button:focus-visible {
      background-color: #1e40af;
    }

    main {
      width: min(100% - 48px, 900px);
      margin: 0 auto;
      padding: 96px 0;
    }

    h1 {
      margin: 0 0 16px;
      color: #1e3a8a;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    main p {
      max-width: 620px;
      margin: 0;
      color: #475569;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    @media (max-width: 640px) {
      .site-header {
        padding: 16px;
      }

      .navbar {
        flex-wrap: wrap;
        gap: 16px;
      }

      .navbar__actions {
        flex: 1 1 100%;
        justify-content: space-between;
        gap: 12px;
      }

      .navbar__links {
        justify-content: flex-start;
        gap: 16px;
      }

      .navbar__button {
        padding: 9px 12px;
      }

      main {
        width: min(100% - 32px, 900px);
        padding: 64px 0;
      }
    }

    @media (max-width: 420px) {
      .navbar__actions {
        align-items: flex-start;
        flex-direction: column;
      }

      .navbar__links {
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="navbar__logo" href="#home">BrightPath</a>
      <div class="navbar__actions">
        <ul class="navbar__links">
          <li><a class="navbar__link" href="#home" aria-current="page">Home</a></li>
          <li><a class="navbar__link" href="#about">About</a></li>
          <li><a class="navbar__link" href="#courses">Courses</a></li>
        </ul>
        <a class="navbar__button" href="#courses">Get started</a>
      </div>
    </nav>
  </header>
  <main id="home">
    <h1>A clear path to new skills</h1>
    <p id="about">Explore practical web development lessons and learn at your own pace. Browse our courses to find the right next step.</p>
    <span id="courses"></span>
  </main>
</body>
</html>
