<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
</head>
<body>
  <main>
    <h1>Create an Account</h1>
    <form>
      <p>
        <label for="name">Abhijeet Singh</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </p>
      <p>
        <label for="email">abhijeet.singh@example.com</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </p>
      <p>
        <label for="password">235547</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
      </p>
      <p>
        <label for="birth-date">12/07/2007</label>
        <input type="date" id="birth-date" name="birth-date">
      </p>
      <p>
        <label for="phone">6387028779</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel">
      </p>
      <fieldset>
        <legend>whatsapp</legend>
        <label for="contact-email">
          <input type="radio" id="contact-email" name="contact-method" value="email" required>
          Email
        </label>
        <label for="contact-phone">
          <input type="radio" id="contact-phone" name="contact-method" value="phone">
          Phone
        </label>
      </fieldset>
      <fieldset>
        <legend>Interests</legend>
        <label for="interest-design">
          <input type="checkbox" id="interest-design" name="interests" value="design">
          cricket
        </label>
        <label for="interest-development">
          <input type="checkbox" id="interest-development" name="interests" value="development">
          Web development
        </label>
      </fieldset>
      <p>
        <label for="course">Choose a course</label>
        <select id="course" name="course">
          <option value="">Select a course</option>
          <option value="html-css">HTML and CSS</option>
          <option value="mern">java</option>
        </select>
      </p>
      <p>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" cols="30"></textarea>
      </p>
      <button type="submit">Sign Up</button>
    </form>

    <section aria-labelledby="events-heading">
      <h2 id="events-heading">Upcoming Events</h2>
      <table>
        <caption>Web development course events</caption>
        <thead>
          <tr>
            <th scope="col">Event</th>
            <th scope="col">Date</th>
            <th scope="col">Location</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>HTML and CSS Workshop</td>
            <td>November 5, 2026</td>
            <td>Online</td>
          </tr>
          <tr>
            <td>MERN Stack Introduction</td>
            <td>November 12, 2026</td>
            <td>Room 204</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="3">2 upcoming events</td>
          </tr>
        </tfoot>
      </table>
    </section>
  </main>
</body>
</html>
