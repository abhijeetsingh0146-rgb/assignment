<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Styled Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    #hero {
      min-height: 100vh;
      display: grid;
      place-content: center;
      gap: 20px;
      padding: 32px;
      background-color: #f1f5f9;
      color: #1e293b;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    h1 {
      color: #2563eb;
    }

    .card {
      max-width: 700px;
      padding: 24px;
      background-color: #ffffff;
      border-left: 4px solid #2563eb;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.1);
    }
  </style>
</head>
<body>
  <main id="hero">
    <h1>My First Styled Page</h1>
    <section class="card">
      <p>CSS adds color, spacing, and layout to an HTML page.</p>
      <p>These styles are written inside the <code>&lt;style&gt;</code> element in the document head.</p>
      <p>Explore the universal, element, class, and ID selectors in the styles above.</p>
    </section>
  </main>
</body>
</html>
