<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Styled Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-page-background: #eef2ff;
      --color-text: #273449;
      --color-heading: #4338ca;
      --color-card-background: #ffffff;
      --color-card-text: #334155;
      --color-accent: #6366f1;
      --color-shadow: rgba(15, 23, 42, 0.1);
      --space-0: 0;
      --space-1: 4px;
      --space-3: 12px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
    }

    * {
      box-sizing: border-box;
      margin: var(--space-0);
      padding: var(--space-0);
      font-family: "Poppins", Arial, sans-serif;
    }

    #hero {
      min-height: 100vh;
      display: grid;
      place-content: center;
      gap: var(--space-5);
      padding: var(--space-8);
      background-color: var(--color-page-background);
      color: var(--color-text);
      font-size: 16px;
      line-height: 1.7;
    }

    h1 {
      color: var(--color-heading);
      font-size: 40px;
      font-weight: 700;
      line-height: 1.2;
    }

    .card {
      max-width: 700px;
      padding: var(--space-6);
      background-color: var(--color-card-background);
      color: var(--color-card-text);
      font-size: 16px;
      line-height: 1.7;
      border-left: var(--space-1) solid var(--color-accent);
      border-radius: 8px;
      box-shadow: 0 var(--space-1) var(--space-6) var(--color-shadow);
    }

    .card p + p {
      margin-top: var(--space-3);
    }
  </style>
</head>
<body>
  <main id="hero">
    <h1>My First Styled Page</h1>
    <section class="card">
      <p>CSS adds color, spacing, and layout to an HTML page.</p>
      <p>These styles are written inside the <code>&lt;style&gt;</code> element in the document head.</p>
      <p>Explore the universal, element, class, and ID selectors in the styles above.</p>
    </section>
  </main>
</body>
</html>
